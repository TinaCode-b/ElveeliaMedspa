<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elveelia Medspa | Price List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #f5ede3;
            font-family: Arial, sans-serif;
            color: #3b2a23;
        }

        .price-page {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .brand {
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 28px;
            letter-spacing: 4px;
            color: #4d3025;
        }

        .brand p {
            margin: 4px 0 0;
            font-size: 12px;
            letter-spacing: 3px;
            color: #a16f5c;
        }

        .price-list-container {
            background: white;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(60, 40, 30, 0.10);
        }

        .price-list-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 22px;
            border-radius: 30px;
            background: #2d2521;
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .brand h1 {
                font-size: 22px;
                letter-spacing: 3px;
            }

            .price-list-container {
                padding: 5px;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="price-page">

        <div class="brand">
            <h1>ELVEELIA</h1>
            <p>MEDSPA</p>
        </div>

        <div class="price-list-container">
            <img
                src="assests/images/elveeliapricelist.jpeg"
                alt="Elveelia Medspa Price List"
            >
        </div>

        <a href="index.html" class="back-link">
            Back to Website
        </a>

    </main>

</body>
</html>
